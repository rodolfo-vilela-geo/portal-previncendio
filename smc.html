<!doctype html>
<html lang="pt-BR">
<head>

<title>SMC — Sistema de Mapeamento de Cicatrizes</title>
<style>
  :root{ --verde:#2e5603; --verde-esc:#1e3a02; --fundo:#eef0e6; --tinta:#1f231a; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{display:flex;flex-direction:column;background:var(--fundo);color:var(--tinta);font:14px/1.4 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
  header{background:var(--verde);color:#fff;border-bottom:4px solid var(--verde-esc);padding:9px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;flex:none}
  header .inst{font-size:12px;opacity:.9} header .inst a{color:#fff;text-decoration:none}
  header h1{margin:1px 0 0;font-size:18px;font-weight:650;line-height:1.2}
  header h1 small{font-weight:400;opacity:.85;font-size:14px}
  nav{display:flex;gap:8px;flex-wrap:wrap}
  nav a{color:#fff;text-decoration:none;font-weight:600;font-size:13px;border:1px solid rgba(255,255,255,.7);border-radius:8px;padding:6px 11px;white-space:nowrap}
  nav a:hover{background:rgba(255,255,255,.14)}
  nav a.prox{background:#fff;color:var(--verde);border-color:#fff}
  nav a.prox:hover{background:#eef3e2}
  main{flex:1;position:relative;min-height:0}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent}
  .carregando{position:absolute;inset:0;display:grid;place-items:center;color:#55594d;font-size:14px;pointer-events:none}
  @media (max-width:600px){ header h1 small{display:none} nav a.nova{display:none} }
  .marca{display:flex;align-items:center;gap:12px;min-width:0}
  .logo img{height:44px;width:auto;display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
</style>
</head>
<body>
<header>
  <div class="marca"><a href="index.html" class="logo" title="SIGFogo"><img src="img/logo_portal_selo.png" alt="SIGFogo"></a><div>
    <div class="inst"><a href="index.html">← SIGFogo</a> · IEF-MG · GPCIF</div>
    <h1>SMC <small>— Sistema de Mapeamento de Cicatrizes</small></h1>
  </div></div>
  <nav>
    <a class="nova" href="https://area-queimada-previncendio.projects.earthengine.app/view/cicatrizes-previncendio" target="_blank" rel="noopener" title="Abre o SMC sozinho, em tela cheia">Tela cheia ↗</a>
    <a class="prox" href="roi.html">Próximo: registrar o ROI →</a>
  </nav>
</header>
<main>
  <div class="carregando">Carregando o SMC… Se não abrir em alguns segundos, use “Tela cheia ↗”.</div>
  <iframe src="https://area-queimada-previncendio.projects.earthengine.app/view/cicatrizes-previncendio"
          title="SMC — Sistema de Mapeamento de Cicatrizes" allow="fullscreen; geolocation; clipboard-write"
          onload="document.querySelector('.carregando').remove()"></iframe>
</main>
</body>
</html>
